name: F-Droid ARM64 Release

on:
  workflow_dispatch:
    inputs:
      git-ref:
        description: "Git ref to build"
        required: false
        default: ""

  push:
    tags:
      - "r*"

permissions:
  contents: write

jobs:
  build:
    name: Build F-Droid ARM64-v8a
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.git-ref != '' && inputs.git-ref || github.ref }}
          submodules: recursive

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install required Android NDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "ndk;30.0.14904198"

      - name: Check NDK
        run: |
          ls -la "$ANDROID_HOME/ndk/30.0.14904198"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/30.0.14904198" >> "$GITHUB_ENV"

      # ---------------------------------------------------------
      # Release signing
      # ---------------------------------------------------------
      #
      # app/build.gradle accesses these properties while Gradle
      # evaluates the release signing configuration.
      #
      - name: Configure release signing
        shell: bash
        run: |
          mkdir -p "$HOME/.gradle"
          mkdir -p "$RUNNER_TEMP/signing"

          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" \
            | base64 --decode \
            > "$RUNNER_TEMP/signing/release.pkcs12"

          cat >> "$HOME/.gradle/gradle.properties" <<EOF
          RELEASE_STORE_FILE=$RUNNER_TEMP/signing/release.pkcs12
          RELEASE_STORE_PASSWORD=${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS=${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD=${{ secrets.RELEASE_KEY_PASSWORD }}
          EOF

      - name: Configure required Gradle properties
        shell: bash
        run: |
          mkdir -p "$HOME/.gradle"

          cat >> "$HOME/.gradle/gradle.properties" <<'EOF'
          librera_appGdriveKey=
          librera_admobAppId=
          librera_admobBannerId=
          librera_admobFullId=
          librera_admobRewardId=

          pdf_classic_appGdriveKey=
          pdf_classic_admobAppId=
          pdf_classic_admobBannerId=
          pdf_classic_admobFullId=
          pdf_classic_admobRewardId=

          ebooka_appGdriveKey=
          ebooka_admobAppId=
          ebooka_admobBannerId=
          ebooka_admobFullId=
          ebooka_admobRewardId=

          pdf_v2_appGdriveKey=
          pdf_v2_admobAppId=
          pdf_v2_admobBannerId=
          pdf_v2_admobFullId=
          pdf_v2_admobRewardId=

          epub_reader_appGdriveKey=
          epub_reader_admobAppId=
          epub_reader_admobBannerId=
          epub_reader_admobFullId=
          epub_reader_admobRewardId=

          tts_reader_appGdriveKey=
          tts_reader_admobAppId=
          tts_reader_admobBannerId=
          tts_reader_admobFullId=
          tts_reader_admobRewardId=

          pro_appGdriveKey=
          pro_admobAppId=
          pro_admobBannerId=
          pro_admobFullId=
          pro_admobRewardId=
          EOF

      # ---------------------------------------------------------
      # Build only ARM64
      # ---------------------------------------------------------
      #
      # Do not use android.injected.build.abi.
      # Temporarily add an abiFilter to the project's Gradle file.
      #
      - name: Restrict build to ARM64-v8a
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path("app/build.gradle")
          text = path.read_text()

          marker = "defaultConfig {"

          if marker not in text:
              raise SystemExit("Could not find defaultConfig in app/build.gradle")

          replacement = """defaultConfig {
              ndk {
                  abiFilters "arm64-v8a"
              }
          """

          text = text.replace(marker, replacement, 1)

          path.write_text(text)
          PY

          grep -n -A5 "defaultConfig" app/build.gradle

      # ---------------------------------------------------------
      # Prepare/build MuPDF
      # ---------------------------------------------------------
      - name: Prepare MuPDF
        shell: bash
        run: |
          cd Builder

          chmod +x link_to_mupdf*.sh

          ./link_to_mupdf*.sh

      # ---------------------------------------------------------
      # Build F-Droid Release
      # ---------------------------------------------------------
      - name: Build F-Droid Release
        run: |
          ./gradlew --no-daemon --stacktrace assembleFdroid

      # ---------------------------------------------------------
      # Show generated APKs
      # ---------------------------------------------------------
      - name: Find APK
        shell: bash
        run: |
          find app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            -print

      # ---------------------------------------------------------
      # Verify only ARM64 APK
      # ---------------------------------------------------------
      - name: Verify ARM64 APK
        shell: bash
        run: |
          set -e

          APKS=$(find app/build/outputs/apk \
            -type f \
            -name "*.apk")

          if [ -z "$APKS" ]; then
            echo "ERROR: No APK generated."
            exit 1
          fi

          BUILD_TOOLS=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)

          for apk in $APKS; do
            echo "Checking: $apk"

            "$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner" \
              verify \
              --verbose \
              "$apk"
          done

      # ---------------------------------------------------------
      # Upload artifact
      # ---------------------------------------------------------
      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: Librera-FDroid-ARM64
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error

      # ---------------------------------------------------------
      # GitHub Release
      # ---------------------------------------------------------
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/r')
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: Librera F-Droid ARM64 ${{ github.ref_name }}
          draft: true
          prerelease: false
          generate_release_notes: true
          files: |
            app/build/outputs/apk/**/*.apk
