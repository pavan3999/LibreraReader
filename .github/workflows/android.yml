name: Build F-Droid ARM64

on:
  workflow_dispatch:
    inputs:
      git-ref:
        description: "Git ref to build (optional)"
        required: false
        default: ""

  push:
    tags:
      - "r*"

permissions:
  contents: write

jobs:
  build:
    name: F-Droid ARM64-v8a Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.git-ref != '' && inputs.git-ref || github.ref }}

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android NDK
        run: |
          sdkmanager "ndk;20.1.5948944"

      - name: Prepare MuPDF
        run: |
          cd Builder
          chmod +x link_to_mupdf*.sh
          ./link_to_mupdf*.sh

      - name: Configure ARM64 only
        run: |
          echo "android.injected.build.abi=arm64-v8a" >> "$HOME/.gradle/gradle.properties"

      - name: Build F-Droid ARM64 Release
        run: |
          ./gradlew --no-daemon --stacktrace assembleFdroidRelease \
            -Pandroid.injected.build.abi=arm64-v8a

      - name: Find APK
        run: |
          find app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            -print

      - name: Verify APK
        run: |
          APK=$(find app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK not found"
            exit 1
          fi

          BUILD_TOOLS=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)

          "$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner" \
            verify \
            --verbose \
            "$APK"

      - name: Upload ARM64 APK
        uses: actions/upload-artifact@v4
        with:
          name: Librera-FDroid-ARM64
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/r')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Librera F-Droid ARM64 ${{ github.ref_name }}
          draft: true
          prerelease: false
          generate_release_notes: true
          files: |
            app/build/outputs/apk/**/*.apk
