name: Pro ARM64 Release

on:
  workflow_dispatch:
    inputs:
      git-ref:
        description: Git Ref (Optional)
        required: false
      dry-run:
        description: Creates a draft release
        required: false

  push:
    tags:
      - "r*"

permissions:
  contents: write

jobs:
  build:
    name: Build Pro ARM64-v8a
    runs-on: ubuntu-latest

    steps:

      # =========================================================
      # Checkout
      # =========================================================
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.git-ref != '' && inputs.git-ref || github.ref }}
          submodules: recursive


      # =========================================================
      # Java
      # =========================================================
      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"


      # =========================================================
      # Android SDK
      # =========================================================
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4


      # =========================================================
      # Android NDK
      # =========================================================
      - name: Install required Android NDK
        shell: bash
        run: |
          set -e

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "ndk;21.4.7075529" \
            "ndk;30.0.14904198"


      # =========================================================
      # Check NDK
      # =========================================================
      - name: Check NDK
        shell: bash
        run: |
          set -e

          NDK="$ANDROID_HOME/ndk/30.0.14904198"

          if [ ! -d "$NDK" ]; then
            echo "ERROR: Required NDK was not installed."
            exit 1
          fi

          echo "Using NDK:"
          echo "$NDK"

          ls -la "$NDK"

          echo "ANDROID_NDK_HOME=$NDK" >> "$GITHUB_ENV"


      # =========================================================
      # Release signing
      # =========================================================
      - name: Configure release signing
        shell: bash
        run: |
          set -e

          mkdir -p "$HOME/.gradle"
          mkdir -p "$RUNNER_TEMP/signing"

          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" \
            | base64 --decode \
            > "$RUNNER_TEMP/signing/release.pkcs12"

          if [ ! -s "$RUNNER_TEMP/signing/release.pkcs12" ]; then
            echo "ERROR: Release keystore was not created."
            exit 1
          fi

          cat >> "$HOME/.gradle/gradle.properties" <<EOF
          RELEASE_STORE_FILE=$RUNNER_TEMP/signing/release.pkcs12
          RELEASE_STORE_PASSWORD=${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS=${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD=${{ secrets.RELEASE_KEY_PASSWORD }}
          EOF


      # =========================================================
      # Gradle properties
      # =========================================================
      - name: Configure required Gradle properties
        shell: bash
        run: |
          set -e

          mkdir -p "$HOME/.gradle"

          cat >> "$HOME/.gradle/gradle.properties" <<'EOF'

          librera_appGdriveKey=
          librera_admobAppId=
          librera_admobBannerId=
          librera_admobFullId=
          librera_admobRewardId=

          pdf_classic_appGdriveKey=
          pdf_classic_admobAppId=
          pdf_classic_admobBannerId=
          pdf_classic_admobFullId=
          pdf_classic_admobRewardId=

          ebooka_appGdriveKey=
          ebooka_admobAppId=
          ebooka_admobBannerId=
          ebooka_admobFullId=
          ebooka_admobRewardId=

          pdf_v2_appGdriveKey=
          pdf_v2_admobAppId=
          pdf_v2_admobBannerId=
          pdf_v2_admobFullId=
          pdf_v2_admobRewardId=

          epub_reader_appGdriveKey=
          epub_reader_admobAppId=
          epub_reader_admobBannerId=
          epub_reader_admobFullId=
          epub_reader_admobRewardId=

          tts_reader_appGdriveKey=
          tts_reader_admobAppId=
          tts_reader_admobBannerId=
          tts_reader_admobFullId=
          tts_reader_admobRewardId=

          pro_appGdriveKey=${{ secrets.PRO_GDRIVE_CLIENT_ID }}
          pro_admobAppId=
          pro_admobBannerId=
          pro_admobFullId=
          pro_admobRewardId=
          EOF


      # =========================================================
      # Firebase / Google Services
      # =========================================================
      - name: Create google-services.json
        shell: bash
        run: |
          set -e

          if [ -z "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" ]; then
            echo "ERROR: GOOGLE_SERVICES_JSON_BASE64 secret is empty."
            exit 1
          fi

          echo "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" \
            | base64 --decode \
            > app/google-services.json

          if [ ! -s app/google-services.json ]; then
            echo "ERROR: google-services.json was not created."
            exit 1
          fi

          echo "google-services.json created successfully."

      # =========================================================
      # MuPDF build dependencies
      # =========================================================
      - name: Install MuPDF build dependencies
        shell: bash
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            mesa-common-dev \
            libxcursor-dev \
            libxrandr-dev \
            libxinerama-dev \
            libglu1-mesa-dev \
            libxi-dev \
            pkg-config \
            libgl-dev

      - name: Cache MuPDF ARM64 libraries
        uses: actions/cache@v5
        with:
          path: |
            app/src/main/jniLibs/arm64-v8a/libMuPDF.so
            app/src/main/jniLibs/arm64-v8a/liblame.so
          key: mupdf-1.28.3-ndk30-arm64-${{ hashFiles('Builder/link_to_mupdf_1.28.3.sh') }}
          restore-keys: |
            mupdf-1.28.3-ndk30-arm64-

      # =========================================================
      # Prepare MuPDF
      # =========================================================
      - name: Prepare MuPDF
        shell: bash
        run: |
          set -e

          LIB_DIR="app/src/main/jniLibs/arm64-v8a"

          if [ -f "$LIB_DIR/libMuPDF.so" ] &&
             [ -f "$LIB_DIR/liblame.so" ]; then
              echo "Cached MuPDF ARM64 libraries found."
              ls -lh "$LIB_DIR"
              exit 0
          fi

          cd Builder
          chmod +x link_to_mupdf_1.28.3.sh
          ./link_to_mupdf_1.28.3.sh


      # =========================================================
      # Verify native libraries BEFORE Gradle
      # =========================================================
      - name: Verify native libraries before Gradle
        shell: bash
        run: |
          set -e

          echo "=============================="
          echo "VERIFY JNI LIBRARIES"
          echo "=============================="

          JNI_DIR="app/src/main/jniLibs/arm64-v8a"

          echo "JNI directory:"
          echo "$JNI_DIR"

          if [ ! -d "$JNI_DIR" ]; then
            echo "ERROR: $JNI_DIR does not exist."
            exit 1
          fi

          echo
          echo "--- Directory ---"
          ls -lah "$JNI_DIR"

          echo
          echo "--- Native libraries ---"

          test -f "$JNI_DIR/libMuPDF.so" || {
            echo "ERROR: libMuPDF.so missing."
            exit 1
          }

          test -f "$JNI_DIR/liblame.so" || {
            echo "ERROR: liblame.so missing."
            exit 1
          }

          echo "libMuPDF.so: FOUND"
          echo "liblame.so: FOUND"

          echo
          echo "--- ELF architecture ---"

          file "$JNI_DIR/libMuPDF.so"
          file "$JNI_DIR/liblame.so"

          echo
          echo "--- Expected: ARM aarch64 ---"

          if ! file "$JNI_DIR/libMuPDF.so" | grep -qi "ARM aarch64"; then
            echo "ERROR: libMuPDF.so is NOT ARM64."
            exit 1
          fi

          if ! file "$JNI_DIR/liblame.so" | grep -qi "ARM aarch64"; then
            echo "ERROR: liblame.so is NOT ARM64."
            exit 1
          fi

          echo
          echo "✓ JNI libraries are present and ARM64."


      # =========================================================
      # Build Pro Release
      # =========================================================
      - name: Build Pro Release
        shell: bash
        run: |
          set -e

          ./gradlew \
            --no-daemon \
            --stacktrace \
            -PsplitByAbi=arm64-v8a \
            assembleProRelease


      # =========================================================
      # Inspect generated Pro APK
      # =========================================================
      - name: Inspect Pro APK native libraries
        shell: bash
        run: |
          set -e

          echo "=============================="
          echo "PRO APK NATIVE LIBRARY CHECK"
          echo "=============================="

          APK=$(find app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: Pro APK not found."
            exit 1
          fi

          echo "APK:"
          echo "$APK"

          echo
          echo "=============================="
          echo "SEARCH libMuPDF.so"
          echo "=============================="

          unzip -l "$APK" | grep -i 'libMuPDF.so' || true

          echo
          echo "=============================="
          echo "SEARCH liblame.so"
          echo "=============================="

          unzip -l "$APK" | grep -i 'liblame.so' || true

          echo
          echo "=============================="
          echo "SEARCH ABI PATHS"
          echo "=============================="

          unzip -l "$APK" \
            | grep -Ei 'arm64|armeabi|x86|mips' \
            || true

          echo
          echo "=============================="
          echo "ALL .so FILES"
          echo "=============================="

          unzip -l "$APK" \
            | grep -Ei '\.so$' \
            || true

          echo
          echo "=============================="
          echo "ALL APK CONTENT"
          echo "=============================="

          unzip -l "$APK"

      # =========================================================
      # Show generated APK output
      # =========================================================
      - name: Show generated APK output
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "Pro release output"
          echo "========================================"

          find app/build/outputs/apk/pro/release \
            -maxdepth 3 \
            -print \
            -exec file {} \;


      # =========================================================
      # Locate generated ARM64 APK
      # =========================================================
      - name: Inspect Pro APK contents
        shell: bash
        run: |
          set -e

          APK=$(find app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK not found."
            exit 1
          fi

          echo "APK:"
          echo "$APK"

          echo
          echo "=============================="
          echo "SEARCH ALL NATIVE LIBRARIES"
          echo "=============================="

          unzip -l "$APK" | grep -Ei \
            '\.(so|aar)$|arm64|armeabi|x86|mips' \
            || true

          echo
          echo "=============================="
          echo "SEARCH MuPDF"
          echo "=============================="

          unzip -l "$APK" | grep -i 'libMuPDF.so' || true

          echo
          echo "=============================="
          echo "SEARCH LAME"
          echo "=============================="

          unzip -l "$APK" | grep -i 'liblame.so' || true

          echo
          echo "=============================="
          echo "ALL APK ENTRIES"
          echo "=============================="

          unzip -l "$APK"

      # =========================================================
      # Copy to stable APK filename
      # =========================================================
      - name: Prepare APK artifact
        shell: bash
        run: |
          set -e

          APK_PATH=$(find app/build/outputs/apk/pro/release \
          -maxdepth 1 \
          -type f \
          -name "Librera Pro-*-arm64.apk" \
          | head -n 1)

          if [ -z "$APK_PATH" ]; then
            echo "ERROR: Pro ARM64 APK not found."
            echo
            echo "Available APKs:"
            find app/build/outputs/apk -type f -name "*.apk" -print
            exit 1
          fi

          echo "Source APK:"
          echo "$APK_PATH"

          mkdir -p artifacts

          cp "$APK_PATH" \
            "artifacts/Librera-Pro-ARM64.apk"

          echo
          echo "Prepared APK:"
          ls -lh artifacts/


      # =========================================================
      # Verify APK signature
      # =========================================================
      - name: Verify APK signature
        shell: bash
        run: |
          set -e

          APK="artifacts/Librera-Pro-ARM64-${{ github.ref_name }}.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK does not exist:"
            echo "$APK"
            exit 1
          fi

          BUILD_TOOLS=$(ls "$ANDROID_HOME/build-tools" \
            | sort -V \
            | tail -1)

          echo "Checking APK signature:"
          echo "$APK"

          "$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner" \
            verify \
            --verbose \
            "$APK"


      # =========================================================
      # Final ARM64-only verification
      # =========================================================
      - name: Verify ARM64-v8a only
        shell: bash
        run: |
          set -e

          APK="artifacts/Librera-Pro-ARM64-${{ github.ref_name }}.apk"

          echo "APK:"
          echo "$APK"

          echo
          echo "========================================"
          echo "Native libraries"
          echo "========================================"

          unzip -l "$APK" | grep -E '(^|/)lib/' || {
            echo "ERROR: No native libraries found."
            exit 1
          }

          echo
          echo "========================================"
          echo "APK native library directories"
          echo "========================================"

          ABIS=$(unzip -l "$APK" \
            | sed -nE 's#.*lib/([^/]+)/.*#\1#p' \
            | sort -u)

          echo "Detected ABI(s):"
          echo "$ABIS"

          if ! echo "$ABIS" | grep -qx "arm64-v8a"; then
            echo "ERROR: arm64-v8a missing."
            exit 1
          fi

          if echo "$ABIS" | grep -Eq \
            '^(armeabi-v7a|x86|x86_64)$'; then
            echo "ERROR: Non-ARM64 ABI detected."
            exit 1
          fi

          echo "✓ ARM64-v8a detected."
          echo "✓ No non-ARM64 ABI detected."

          echo
          echo "========================================"
          echo "APK native ELF files"
          echo "========================================"

          rm -rf "$RUNNER_TEMP/apk-check"
          mkdir -p "$RUNNER_TEMP/apk-check"

          unzip -q "$APK" \
            -d "$RUNNER_TEMP/apk-check"

          find "$RUNNER_TEMP/apk-check" \
            -type f \
            -name "*.so" \
            -exec file {} \;

          echo
          echo "========================================"
          echo "VERIFY ELF ARCHITECTURE"
          echo "========================================"

          while IFS= read -r -d '' SO; do
            echo "Checking:"
            echo "$SO"

            if ! file "$SO" | grep -qi "ARM aarch64"; then
              echo "ERROR: Non-ARM64 ELF detected:"
              echo "$SO"
              file "$SO"
              exit 1
            fi
          done < <(
            find "$RUNNER_TEMP/apk-check/lib/arm64-v8a" \
              -type f \
              -name "*.so" \
              -print0
          )

          echo
          echo "✓ All APK native libraries are ARM64."


      # =========================================================
      # APK information
      # =========================================================
      - name: APK information
        shell: bash
        run: |
          set -e

          APK="artifacts/Librera-Pro-ARM64-${{ github.ref_name }}.apk"

          echo "========================================"
          echo "APK"
          echo "========================================"

          ls -lh "$APK"

          echo
          echo "SHA-256:"
          sha256sum "$APK"


      # =========================================================
      # Upload GitHub Actions artifact
      # =========================================================
      - name: Upload ARM64 APK
        uses: actions/upload-artifact@v7
        with:
          name: Librera-Pro-ARM64
          path: artifacts/*.apk
          if-no-files-found: error


      # =========================================================
      # Create draft GitHub Release
      # =========================================================
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/r')
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: Librera Pro ARM64 ${{ github.ref_name }}
          draft: true
          prerelease: false
          generate_release_notes: true
          files: |
            artifacts/*.apk
