name: Pro ARM64 Release

on:
  workflow_dispatch:
    inputs:
      git-ref:
        description: Git Ref (Optional)
        required: false
      dry-run:
        description: Creates a draft release
        required: false

  push:
    tags:
      - "r*"

permissions:
  contents: write

jobs:
  build:
    name: Build Pro ARM64-v8a
    runs-on: ubuntu-latest

    steps:
      # ---------------------------------------------------------
      # Checkout
      # ---------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.git-ref != '' && inputs.git-ref || github.ref }}
          submodules: recursive

      # ---------------------------------------------------------
      # Java
      # ---------------------------------------------------------
      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      # ---------------------------------------------------------
      # Android SDK
      # ---------------------------------------------------------
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      # ---------------------------------------------------------
      # NDK
      # ---------------------------------------------------------
      - name: Install required Android NDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "ndk;21.4.7075529" "ndk;30.0.14904198"

      - name: Check NDK
        shell: bash
        run: |
          set -e

          NDK="$ANDROID_HOME/ndk/30.0.14904198"

          if [ ! -d "$NDK" ]; then
            echo "ERROR: Required NDK was not installed."
            exit 1
          fi

          ls -la "$NDK"

          echo "ANDROID_NDK_HOME=$NDK" >> "$GITHUB_ENV"

      # ---------------------------------------------------------
      # Release signing
      # ---------------------------------------------------------
      - name: Configure release signing
        shell: bash
        run: |
          set -e

          mkdir -p "$HOME/.gradle"
          mkdir -p "$RUNNER_TEMP/signing"

          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" \
            | base64 --decode \
            > "$RUNNER_TEMP/signing/release.pkcs12"

          if [ ! -s "$RUNNER_TEMP/signing/release.pkcs12" ]; then
            echo "ERROR: Release keystore was not created."
            exit 1
          fi

          cat >> "$HOME/.gradle/gradle.properties" <<EOF
          RELEASE_STORE_FILE=$RUNNER_TEMP/signing/release.pkcs12
          RELEASE_STORE_PASSWORD=${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS=${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD=${{ secrets.RELEASE_KEY_PASSWORD }}
          EOF

      # ---------------------------------------------------------
      # Gradle properties required during project configuration
      # ---------------------------------------------------------
      #
      # These are needed because app/build.gradle evaluates
      # properties belonging to multiple flavors while Gradle
      # configures the project.
      #
      # They are intentionally empty for this Pro build.
      #
      - name: Configure required Gradle properties
        shell: bash
        run: |
          set -e

          mkdir -p "$HOME/.gradle"

          cat >> "$HOME/.gradle/gradle.properties" <<'EOF'

          librera_appGdriveKey=
          librera_admobAppId=
          librera_admobBannerId=
          librera_admobFullId=
          librera_admobRewardId=

          pdf_classic_appGdriveKey=
          pdf_classic_admobAppId=
          pdf_classic_admobBannerId=
          pdf_classic_admobFullId=
          pdf_classic_admobRewardId=

          ebooka_appGdriveKey=
          ebooka_admobAppId=
          ebooka_admobBannerId=
          ebooka_admobFullId=
          ebooka_admobRewardId=

          pdf_v2_appGdriveKey=
          pdf_v2_admobAppId=
          pdf_v2_admobBannerId=
          pdf_v2_admobFullId=
          pdf_v2_admobRewardId=

          epub_reader_appGdriveKey=
          epub_reader_admobAppId=
          epub_reader_admobBannerId=
          epub_reader_admobFullId=
          epub_reader_admobRewardId=

          tts_reader_appGdriveKey=
          tts_reader_admobAppId=
          tts_reader_admobBannerId=
          tts_reader_admobFullId=
          tts_reader_admobRewardId=

          pro_appGdriveKey=${{ secrets.PRO_GDRIVE_CLIENT_ID }}
          pro_admobAppId=
          pro_admobBannerId=
          pro_admobFullId=
          pro_admobRewardId=
          EOF

      # ---------------------------------------------------------
      # Firebase / Google Services
      # ---------------------------------------------------------
      - name: Create google-services.json
        shell: bash
        run: |
          set -e

          if [ -z "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" ]; then
            echo "ERROR: GOOGLE_SERVICES_JSON_BASE64 secret is empty."
            exit 1
          fi

          echo "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" \
            | base64 --decode \
            > app/google-services.json

          if [ ! -s app/google-services.json ]; then
            echo "ERROR: google-services.json was not created."
            exit 1
          fi

          echo "google-services.json created successfully."

      # ---------------------------------------------------------
      # Restrict Android build to ARM64-v8a
      # ---------------------------------------------------------
      - name: Restrict build to ARM64-v8a
        shell: bash
        run: |
          set -e

          python3 <<'PY'
          from pathlib import Path

          path = Path("app/build.gradle")
          text = path.read_text()

          marker = "defaultConfig {"

          if marker not in text:
              raise SystemExit(
                  "ERROR: Could not find defaultConfig in app/build.gradle"
              )

          # Avoid inserting it twice if this workflow/script is
          # ever changed to reuse the modified file.
          if 'abiFilters "arm64-v8a"' in text:
              print("ARM64 abiFilter already present.")
          else:
              replacement = """defaultConfig {
              ndk {
                  abiFilters "arm64-v8a"
              }
          """

              text = text.replace(marker, replacement, 1)
              path.write_text(text)

          PY

          echo
          echo "ARM64 configuration:"
          grep -n -A6 "defaultConfig" app/build.gradle

      - name: Install MuPDF build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            mesa-common-dev \
            libxcursor-dev \
            libxrandr-dev \
            libxinerama-dev \
            libglu1-mesa-dev \
            libxi-dev \
            pkg-config \
            libgl-dev

      # ---------------------------------------------------------
      # Prepare MuPDF
      # ---------------------------------------------------------
      - name: Prepare MuPDF
        shell: bash
        run: |
          set -e

          cd Builder

          chmod +x link_to_mupdf_1.28.3.sh

          ./link_to_mupdf_1.28.3.sh

      - name: Verify native libraries before Gradle
        shell: bash
        run: |
          set -e

          echo "=============================="
          echo "VERIFY JNI LIBRARIES"
          echo "=============================="

          pwd

          echo "--- app/src/main/jniLibs ---"
          ls -la app/src/main/jniLibs

          echo "--- arm64-v8a ---"
          ls -la app/src/main/jniLibs/arm64-v8a

          echo "--- resolved path ---"
          readlink -f app/src/main/jniLibs/arm64-v8a

          echo "--- SO files ---"
          find -L app/src/main/jniLibs -type f -name "*.so" -ls

          echo "--- MuPDF SO ---"
          test -f app/src/main/jniLibs/arm64-v8a/libMuPDF.so

          echo "--- LAME SO ---"
          test -f app/src/main/jniLibs/arm64-v8a/liblame.so

          echo "Native libraries are present."

      # ---------------------------------------------------------
      # Build Pro Release
      # ---------------------------------------------------------
      - name: Build Pro Release
        shell: bash
        run: |
          set -e

          ./gradlew \
            --no-daemon \
            --stacktrace \
            assembleProRelease

      - name: Inspect Pro APK native libraries
        shell: bash
        run: |
          set -e

          echo "=============================="
          echo "PRO APK NATIVE LIBRARY CHECK"
          echo "=============================="

          find . -type f -name "*.apk" -print

          APK=$(find . -type f -name "*.apk" | grep -i "Pro" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: Pro APK not found"
            exit 1
          fi

          echo "APK: $APK"

          echo "=============================="
          echo "ARM64 LIBRARIES IN APK"
          echo "=============================="

          unzip -l "$APK" | grep 'lib/arm64-v8a/' || true

          echo "=============================="
          echo "MuPDF"
          echo "=============================="

          if unzip -l "$APK" | grep -q 'lib/arm64-v8a/libMuPDF.so'; then
            echo "libMuPDF.so: FOUND"
          else
            echo "libMuPDF.so: MISSING"
          fi

          echo "=============================="
          echo "LAME"
          echo "=============================="

          if unzip -l "$APK" | grep -q 'lib/arm64-v8a/liblame.so'; then
            echo "liblame.so: FOUND"
          else
            echo "liblame.so: MISSING"
          fi

          echo "=============================="
          echo "GRADLE NATIVE LIBRARIES"
          echo "=============================="

          find app/build -type f \
            \( -name "libMuPDF.so" -o -name "liblame.so" \) \
            -print 2>/dev/null || true

      # ---------------------------------------------------------
      # Show generated output
      # ---------------------------------------------------------
      - name: Show generated APK output
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "Pro release output"
          echo "========================================"

          find app/build/outputs/apk/pro/release \
            -maxdepth 3 \
            -print \
            -exec file {} \;

      # ---------------------------------------------------------
      # Locate actual APK
      # ---------------------------------------------------------
      #
      # Do NOT assume the APK has a .apk extension.
      # The previous build produced:
      #
      # app/build/outputs/apk/pro/release/Librera
      #
      # so we locate regular files and identify the APK.
      #
      - name: Locate generated APK
        shell: bash
        run: |
          set -e

          OUTPUT_DIR="app/build/outputs/apk/pro/release"

          if [ ! -d "$OUTPUT_DIR" ]; then
            echo "ERROR: APK output directory does not exist:"
            echo "$OUTPUT_DIR"
            exit 1
          fi

          APK=""

          while IFS= read -r -d '' file; do
            TYPE=$(file -b "$file")

            echo "Checking candidate:"
            echo "  $file"
            echo "  $TYPE"

            if echo "$TYPE" | grep -qiE \
              'Android package|Zip archive|Java archive'; then
              APK="$file"
              break
            fi
          done < <(find "$OUTPUT_DIR" -type f -print0)

          if [ -z "$APK" ]; then
            echo
            echo "ERROR: Could not locate generated APK."
            echo
            echo "Available files:"
            find "$OUTPUT_DIR" -type f -print
            exit 1
          fi

          echo
          echo "APK found:"
          echo "$APK"

          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

      # ---------------------------------------------------------
      # Copy to a stable APK filename
      # ---------------------------------------------------------
      - name: Prepare ARM64 APK
        shell: bash
        run: |
          set -e

          mkdir -p artifacts

          cp "$APK_PATH" \
            "artifacts/Librera-Pro-ARM64-${{ github.ref_name }}.apk"

          echo "Prepared APK:"
          ls -lh artifacts/

      # ---------------------------------------------------------
      # Verify APK signature
      # ---------------------------------------------------------
      - name: Verify APK signature
        shell: bash
        run: |
          set -e

          APK="artifacts/Librera-Pro-ARM64-${{ github.ref_name }}.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK does not exist:"
            echo "$APK"
            exit 1
          fi

          BUILD_TOOLS=$(ls "$ANDROID_HOME/build-tools" \
            | sort -V \
            | tail -1)

          echo "Checking APK signature:"
          echo "$APK"

          "$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner" \
            verify \
            --verbose \
            "$APK"

      # ---------------------------------------------------------
      # Verify ARM64-v8a only
      # ---------------------------------------------------------
      - name: Verify ARM64-v8a only
        shell: bash
        run: |
          set -e

          APK="artifacts/Librera-Pro-ARM64-${{ github.ref_name }}.apk"

          echo "APK:"
          echo "$APK"

          echo
          echo "========================================"
          echo "Native libraries"
          echo "========================================"

          unzip -l "$APK" | grep -E '(^|/)lib/' || true

          echo
          echo "========================================"
          echo "APK native library directories"
          echo "========================================"

          ABIS=$(unzip -l "$APK" \
            | sed -nE 's#.*lib/([^/]+)/.*#\1#p' \
            | sort -u)

          if [ -z "$ABIS" ]; then
            echo "WARNING: No lib/<ABI>/ directory found."
            echo
            echo "This APK may contain native code outside the normal"
            echo "lib/<ABI>/ layout."
          else
            echo "Detected ABI(s):"
            echo "$ABIS"

            if echo "$ABIS" | grep -Eq \
              '^(armeabi-v7a|x86|x86_64)$'; then
              echo "ERROR: Non-ARM64 ABI detected."
              exit 1
            fi

            if echo "$ABIS" | grep -q '^arm64-v8a$'; then
              echo "✓ ARM64-v8a detected."
            fi
          fi

          echo
          echo "========================================"
          echo "APK native ELF files"
          echo "========================================"

          mkdir -p "$RUNNER_TEMP/apk-check"

          unzip -q "$APK" \
            -d "$RUNNER_TEMP/apk-check"

          find "$RUNNER_TEMP/apk-check" \
            -type f \
            -exec file {} \; \
            | grep -E 'ELF|shared object' \
            || true

      # ---------------------------------------------------------
      # Show APK information
      # ---------------------------------------------------------
      - name: APK information
        shell: bash
        run: |
          set -e

          APK="artifacts/Librera-Pro-ARM64-${{ github.ref_name }}.apk"

          echo "========================================"
          echo "APK"
          echo "========================================"

          ls -lh "$APK"

          echo
          echo "SHA-256:"
          sha256sum "$APK"

      # ---------------------------------------------------------
      # Upload GitHub Actions artifact
      # ---------------------------------------------------------
      - name: Upload ARM64 APK
        uses: actions/upload-artifact@v7
        with:
          name: Librera-Pro-ARM64
          path: artifacts/*.apk
          if-no-files-found: error

      # ---------------------------------------------------------
      # Create draft GitHub Release
      # ---------------------------------------------------------
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/r')
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: Librera Pro ARM64 ${{ github.ref_name }}
          draft: true
          prerelease: false
          generate_release_notes: true
          files: |
            artifacts/*.apk
            
